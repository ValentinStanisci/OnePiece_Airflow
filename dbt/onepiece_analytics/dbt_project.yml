name: 'onepiece_analytics'
version: '1.0.0'
config-version: 2

# Directorio de perfiles (se crea automáticamente)
profile: 'onepiece_analytics'

# Directorios del proyecto
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Directorio de salida para archivos compilados
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuración de modelos
models:
  onepiece_analytics:
    # Modelos de staging (capa bronze/raw)
    staging:
      +materialized: view
      +schema: staging
    
    # Modelos intermedios (capa silver)
    intermediate:
      +materialized: view
      +schema: intermediate
    
    # Modelos finales (capa gold/marts)
    marts:
      +materialized: table
      +schema: marts

# Variables del proyecto
vars:
  current_year: '1526'  # Año actual en el calendario de One Piece
